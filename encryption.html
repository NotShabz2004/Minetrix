<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Encrypted</title>
    <style>
      body {
        background-color: #0f172a;
        color: white;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        font-family: sans-serif;
        flex-direction: column;
      }

      .btn {
        background: #4f46e5;
        color: white;
        padding: 10px 20px;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        font-size: 16px;
        margin-top: 20px;
        text-decoration: none;
      }

      .btn:hover {
        background: #3b3b99;
      }
    </style>
  </head>
  <body>
    <h1>🔐 File Encrypted</h1>
    <p>Encrypted file saved as: <strong>{{ filename }}</strong></p>

    <!-- Redirect to NAS Button -->
    <a href="http://192.168.1.100/files/" class="btn"> Go to NAS Storage </a>
  </body>
</html>
